<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="iotBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a141a"/>
      <stop offset="100%" stop-color="#112936"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#iotBg)"/>
  <rect x="50" y="40" width="500" height="280" rx="14" fill="#091b24" stroke="#155e75" stroke-width="1.5"/>

  <text x="80" y="75" fill="#f0fdfa" font-family="sans-serif" font-size="14" font-weight="700">Lightweight IoT Quorum Distributed Consensus</text>
  <text x="80" y="93" fill="#5eead4" font-family="sans-serif" font-size="10">Undergraduate Capstone CS Thesis | C++ Discrete Event Simulator</text>

  <!-- Node Topology Mesh -->
  <g stroke="#0e7490" stroke-width="1.5" stroke-dasharray="2,2">
    <line x1="180" y1="180" x2="300" y2="130"/>
    <line x1="180" y1="180" x2="250" y2="250"/>
    <line x1="300" y1="130" x2="420" y2="180"/>
    <line x1="300" y1="130" x2="350" y2="250"/>
    <line x1="250" y1="250" x2="350" y2="250"/>
    <line x1="420" y1="180" x2="350" y2="250"/>
  </g>

  <!-- Edge Nodes -->
  <circle cx="180" cy="180" r="22" fill="#155e75" stroke="#2dd4bf" stroke-width="2"/>
  <text x="180" y="184" fill="#ffffff" font-family="monospace" font-size="10" text-anchor="middle">Node A</text>

  <circle cx="300" cy="130" r="26" fill="#047857" stroke="#34d399" stroke-width="2.5"/>
  <text x="300" y="134" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Leader</text>

  <circle cx="420" cy="180" r="22" fill="#155e75" stroke="#2dd4bf" stroke-width="2"/>
  <text x="420" y="184" fill="#ffffff" font-family="monospace" font-size="10" text-anchor="middle">Node B</text>

  <circle cx="250" cy="250" r="20" fill="#155e75" stroke="#2dd4bf" stroke-width="2"/>
  <text x="250" y="254" fill="#ffffff" font-family="monospace" font-size="9" text-anchor="middle">Node C</text>

  <circle cx="350" cy="250" r="20" fill="#155e75" stroke="#2dd4bf" stroke-width="2"/>
  <text x="350" y="254" fill="#ffffff" font-family="monospace" font-size="9" text-anchor="middle">Node D</text>

  <!-- Stat pill -->
  <rect x="390" y="255" width="135" height="32" rx="16" fill="#134e4a" stroke="#2dd4bf" stroke-width="1"/>
  <text x="457" y="275" fill="#ccfbf1" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Latency Cut: -34%</text>
</svg>

