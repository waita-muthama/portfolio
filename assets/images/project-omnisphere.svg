<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bg1)"/>
  <circle cx="480" cy="80" r="140" fill="url(#accentGlow)"/>
  
  <!-- Grid background lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="40" y1="40" x2="560" y2="40"/>
    <line x1="40" y1="100" x2="560" y2="100"/>
    <line x1="40" y1="160" x2="560" y2="160"/>
    <line x1="40" y1="220" x2="560" y2="220"/>
    <line x1="40" y1="280" x2="560" y2="280"/>
    <line x1="120" y1="20" x2="120" y2="340"/>
    <line x1="240" y1="20" x2="240" y2="340"/>
    <line x1="360" y1="20" x2="360" y2="340"/>
    <line x1="480" y1="20" x2="480" y2="340"/>
  </g>

  <!-- Dashboard Window -->
  <rect x="60" y="45" width="480" height="270" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.5))"/>
  
  <!-- Window Header -->
  <rect x="60" y="45" width="480" height="32" rx="12" fill="#1e293b"/>
  <rect x="60" y="65" width="480" height="12" fill="#1e293b"/>
  <circle cx="82" cy="61" r="5" fill="#ef4444"/>
  <circle cx="98" cy="61" r="5" fill="#f59e0b"/>
  <circle cx="114" cy="61" r="5" fill="#10b981"/>
  <text x="300" y="66" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" font-weight="500">omnisphere-telemetry-v2.cluster.live</text>

  <!-- Left Sidebar Mini -->
  <rect x="75" y="95" width="90" height="200" rx="6" fill="#131e36"/>
  <rect x="85" y="110" width="70" height="8" rx="4" fill="#38bdf8" opacity="0.8"/>
  <rect x="85" y="128" width="50" height="6" rx="3" fill="#475569"/>
  <rect x="85" y="144" width="60" height="6" rx="3" fill="#475569"/>
  <rect x="85" y="160" width="45" height="6" rx="3" fill="#475569"/>
  <rect x="85" y="176" width="55" height="6" rx="3" fill="#475569"/>

  <!-- Top Metrics Cards -->
  <rect x="180" y="95" width="105" height="55" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="190" y="112" fill="#94a3b8" font-family="sans-serif" font-size="9">PODS HEALTHY</text>
  <text x="190" y="136" fill="#10b981" font-family="sans-serif" font-size="18" font-weight="bold">99.98%</text>

  <rect x="295" y="95" width="115" height="55" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="305" y="112" fill="#94a3b8" font-family="sans-serif" font-size="9">AVG LATENCY</text>
  <text x="305" y="136" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="bold">42 ms</text>

  <rect x="420" y="95" width="105" height="55" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="430" y="112" fill="#94a3b8" font-family="sans-serif" font-size="9">THROUGHPUT</text>
  <text x="430" y="136" fill="#818cf8" font-family="sans-serif" font-size="18" font-weight="bold">14.8k/s</text>

  <!-- Big Waveform Chart Area -->
  <rect x="180" y="160" width="345" height="135" rx="8" fill="#111c33" stroke="#1e293b"/>
  <!-- Chart grid lines -->
  <line x1="180" y1="200" x2="525" y2="200" stroke="#1e293b" stroke-dasharray="3,3"/>
  <line x1="180" y1="240" x2="525" y2="240" stroke="#1e293b" stroke-dasharray="3,3"/>
  <!-- Chart line with gradient fill -->
  <path d="M 180 255 Q 210 230 240 245 T 300 200 T 360 215 T 420 185 T 470 195 T 525 175 L 525 295 L 180 295 Z" fill="url(#accentGlow)"/>
  <path d="M 180 255 Q 210 230 240 245 T 300 200 T 360 215 T 420 185 T 470 195 T 525 175" fill="none" stroke="url(#cyanGrad)" stroke-width="3"/>

  <!-- Live Pulse Dot -->
  <circle cx="525" cy="175" r="4" fill="#38bdf8"/>
  <circle cx="525" cy="175" r="8" fill="#38bdf8" opacity="0.4"/>
</svg>

