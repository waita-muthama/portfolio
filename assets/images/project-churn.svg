<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="churnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121e"/>
      <stop offset="60%" stop-color="#111c2e"/>
      <stop offset="100%" stop-color="#16273f"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#churnBg)"/>

  <!-- Grid overlay -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="90" x2="600" y2="90"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="270" x2="600" y2="270"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
  </g>

  <!-- Container Box -->
  <rect x="50" y="45" width="500" height="270" rx="14" fill="#0b1322" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <text x="80" y="80" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Predictive Churn Classifier (XGBoost)</text>
  <text x="80" y="98" fill="#64748b" font-family="sans-serif" font-size="11">AUC-ROC Score: 0.942 | Precision: 92.4% | n=65,000</text>
  <rect x="440" y="65" width="85" height="26" rx="13" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="482" y="82" fill="#c084fc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ACTIVE MODEL</text>

  <!-- Left: ROC-AUC Chart -->
  <rect x="80" y="120" width="180" height="165" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="95" y="142" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">ROC CURVE BENCHMARK</text>
  <!-- Diagonal baseline -->
  <line x1="100" y1="260" x2="240" y2="160" stroke="#475569" stroke-dasharray="3,3"/>
  <!-- The ROC curve -->
  <path d="M 100 260 C 105 170, 140 160, 240 160" fill="none" stroke="#ec4899" stroke-width="2.5"/>
  <text x="175" y="210" fill="#ec4899" font-family="sans-serif" font-size="9" font-weight="bold">Model (0.94)</text>
  <text x="180" y="240" fill="#64748b" font-family="sans-serif" font-size="8">Random (0.50)</text>

  <!-- Right: Feature Importance Bar Chart -->
  <rect x="280" y="120" width="245" height="165" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="295" y="142" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">TOP CHURN RISK FACTORS</text>

  <!-- Bar 1 -->
  <text x="295" y="166" fill="#cbd5e1" font-family="sans-serif" font-size="9">Tenure Length &lt; 3mo</text>
  <rect x="295" y="172" width="180" height="10" rx="5" fill="#8b5cf6"/>
  <text x="485" y="181" fill="#8b5cf6" font-family="sans-serif" font-size="9" font-weight="bold">38%</text>

  <!-- Bar 2 -->
  <text x="295" y="200" fill="#cbd5e1" font-family="sans-serif" font-size="9">Payment Method Friction</text>
  <rect x="295" y="206" width="135" height="10" rx="5" fill="#a855f7"/>
  <text x="440" y="215" fill="#a855f7" font-family="sans-serif" font-size="9" font-weight="bold">27%</text>

  <!-- Bar 3 -->
  <text x="295" y="234" fill="#cbd5e1" font-family="sans-serif" font-size="9">Decreased Login Frequency</text>
  <rect x="295" y="240" width="95" height="10" rx="5" fill="#c084fc"/>
  <text x="400" y="249" fill="#c084fc" font-family="sans-serif" font-size="9" font-weight="bold">19%</text>

  <!-- Bar 4 -->
  <text x="295" y="268" fill="#cbd5e1" font-family="sans-serif" font-size="9">Support Ticket Velocity</text>
  <rect x="295" y="272" width="55" height="10" rx="5" fill="#e879f9"/>
  <text x="360" y="281" fill="#e879f9" font-family="sans-serif" font-size="9" font-weight="bold">11%</text>
</svg>

