<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="glowEffect" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Clean White Backdrop -->
  <circle cx="160" cy="160" r="150" fill="url(#avatarBg)" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="160" cy="160" r="130" fill="url(#glowEffect)"/>

  <!-- Rotating tech orbit rings -->
  <circle cx="160" cy="160" r="142" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="16 10"/>
  <circle cx="160" cy="160" r="118" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="8 8" opacity="0.4"/>

  <!-- Orbital nodes -->
  <circle cx="265" cy="100" r="5" fill="#2563eb"/>
  <circle cx="65" cy="205" r="5" fill="#059669"/>
  <circle cx="160" cy="18" r="4.5" fill="#d97706"/>

  <!-- Inner Badge Plate -->
  <rect x="68" y="68" width="184" height="184" rx="36" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="drop-shadow(0 8px 16px rgba(37,99,235,0.08))"/>

  <!-- Stylized Monogram "JMW" -->
  <text x="160" y="154" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-2" text-anchor="middle">JMW</text>

  <!-- Subtitle Tag: CS & DATA & ENTERPRISE -->
  <rect x="88" y="180" width="144" height="26" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="160" y="197" fill="#2563eb" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">BSc COMP SCI</text>

  <!-- Terminal prompt accents -->
  <circle cx="95" cy="95" r="3.5" fill="#ef4444"/>
  <circle cx="108" cy="95" r="3.5" fill="#f59e0b"/>
  <circle cx="121" cy="95" r="3.5" fill="#10b981"/>
</svg>
