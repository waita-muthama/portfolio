<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="growthBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09141f"/>
      <stop offset="50%" stop-color="#0c2331"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="funnelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#growthBg)"/>

  <!-- Funnel Analysis Dashboard Shell -->
  <rect x="50" y="40" width="500" height="280" rx="14" fill="#0b1724" stroke="#164e63" stroke-width="1.5"/>

  <!-- Top Bar -->
  <text x="80" y="75" fill="#f0fdf4" font-family="sans-serif" font-size="14" font-weight="700">Growth Marketing Funnel &amp; A/B Significance</text>
  <text x="80" y="93" fill="#67e8f9" font-family="sans-serif" font-size="10">Conversion Lift: +28.5% (p &lt; 0.01) | GA4 Data Integration</text>

  <!-- Left: Funnel Bars -->
  <!-- Stage 1 -->
  <rect x="80" y="125" width="220" height="26" rx="6" fill="#0284c7" opacity="0.9"/>
  <text x="90" y="142" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">1. Organic &amp; Paid Traffic</text>
  <text x="290" y="142" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="end">100,000 (100%)</text>

  <!-- Stage 2 -->
  <rect x="100" y="160" width="180" height="26" rx="6" fill="#0891b2" opacity="0.9"/>
  <text x="110" y="177" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">2. Landing Page Engaged</text>
  <text x="270" y="177" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="end">48,200 (48.2%)</text>

  <!-- Stage 3 -->
  <rect x="120" y="195" width="140" height="26" rx="6" fill="#0d9488" opacity="0.9"/>
  <text x="130" y="212" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">3. Product Demo / Signup</text>
  <text x="250" y="212" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="end">16,400 (16.4%)</text>

  <!-- Stage 4 -->
  <rect x="140" y="230" width="100" height="26" rx="6" fill="#059669" opacity="0.95"/>
  <text x="150" y="247" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">4. Checkout Paid</text>
  <text x="230" y="247" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="end">4,680 (4.68%)</text>

  <!-- Right: A/B Test Card -->
  <rect x="330" y="125" width="190" height="150" rx="10" fill="#112233" stroke="#1e3a5f"/>
  <text x="345" y="150" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">A/B TEST VARIANT RESULTS</text>

  <text x="345" y="175" fill="#94a3b8" font-family="sans-serif" font-size="10">Control (Original):</text>
  <text x="505" y="175" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="end">3.64% CR</text>

  <text x="345" y="200" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold">Variant B (Optimized):</text>
  <text x="505" y="200" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="end">4.68% CR</text>

  <rect x="345" y="215" width="160" height="8" rx="4" fill="#1e293b"/>
  <rect x="345" y="215" width="135" height="8" rx="4" fill="#10b981"/>

  <text x="345" y="245" fill="#f8fafc" font-family="sans-serif" font-size="9">Statistical Confidence: 99.2%</text>
  <text x="345" y="260" fill="#38bdf8" font-family="sans-serif" font-size="9">Status: Winner Declared</text>

  <!-- Attribution tags -->
  <rect x="80" y="275" width="220" height="24" rx="4" fill="#13273d"/>
  <text x="190" y="291" fill="#7dd3fc" font-family="sans-serif" font-size="9" text-anchor="middle">Multi-Touch Attribution: First-Click + Time Decay</text>
</svg>

