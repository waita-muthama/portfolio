<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="nexusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#nexusBg)"/>
  <rect x="50" y="40" width="500" height="280" rx="14" fill="#0f172a" stroke="#4338ca" stroke-width="1.5"/>

  <text x="80" y="75" fill="#e0e7ff" font-family="sans-serif" font-size="14" font-weight="700">Nexus Distributed E-Commerce Architecture</text>
  <text x="80" y="93" fill="#a5b4fc" font-family="sans-serif" font-size="10">High-Concurrency Inventory Locking &amp; Stripe Webhook Flow</text>

  <!-- Flow boxes -->
  <!-- Box 1 -->
  <rect x="75" y="140" width="115" height="110" rx="8" fill="#1e1b4b" stroke="#6366f1"/>
  <text x="132" y="170" fill="#c7d2fe" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">React Frontend</text>
  <text x="132" y="195" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Shopping Cart</text>
  <text x="132" y="215" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Token Checkout</text>

  <!-- Arrow 1 -->
  <line x1="190" y1="195" x2="235" y2="195" stroke="#818cf8" stroke-width="2"/>
  <polygon points="235,190 245,195 235,200" fill="#818cf8"/>

  <!-- Box 2 -->
  <rect x="245" y="125" width="125" height="140" rx="8" fill="#1e293b" stroke="#3b82f6"/>
  <text x="307" y="155" fill="#93c5fd" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Node.js API</text>
  <rect x="255" y="170" width="105" height="24" rx="4" fill="#0284c7"/>
  <text x="307" y="186" fill="#ffffff" font-family="monospace" font-size="9" text-anchor="middle">Redis Redlock</text>
  <rect x="255" y="205" width="105" height="24" rx="4" fill="#334155"/>
  <text x="307" y="221" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">Stripe Signature</text>

  <!-- Arrow 2 -->
  <line x1="370" y1="195" x2="405" y2="195" stroke="#818cf8" stroke-width="2"/>
  <polygon points="405,190 415,195 405,200" fill="#818cf8"/>

  <!-- Box 3 -->
  <rect x="415" y="140" width="115" height="110" rx="8" fill="#14261c" stroke="#10b981"/>
  <text x="472" y="170" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PostgreSQL</text>
  <text x="472" y="195" fill="#6ee7b7" font-family="sans-serif" font-size="9" text-anchor="middle">ACID Transactions</text>
  <text x="472" y="215" fill="#6ee7b7" font-family="sans-serif" font-size="9" text-anchor="middle">Pessimistic Row Lock</text>

  <!-- Bottom Metric -->
  <rect x="80" y="275" width="450" height="26" rx="6" fill="#131e33"/>
  <text x="305" y="292" fill="#38bdf8" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">Benchmarked at 5,000+ Concurrent Requests with Zero Race Conditions</text>
</svg>

