<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="anomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#anomBg)"/>

  <!-- LaTeX Paper Header Style -->
  <rect x="50" y="35" width="500" height="290" rx="12" fill="#0c1322" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="50" y="35" width="500" height="42" rx="12" fill="#131e33"/>
  <rect x="50" y="65" width="500" height="12" fill="#131e33"/>

  <!-- IEEE Conference / Research Header -->
  <text x="75" y="62" fill="#38bdf8" font-family="'Courier New', monospace" font-size="12" font-weight="bold">[RESEARCH PAPER // IEEE FORMAT]</text>
  <text x="525" y="62" fill="#10b981" font-family="'Courier New', monospace" font-size="11" text-anchor="end">ACCURACY: 98.7%</text>

  <!-- Network Topology / Neural Graph -->
  <!-- Layer 1: Input Packets -->
  <g fill="#38bdf8">
    <circle cx="120" cy="130" r="10"/>
    <circle cx="120" cy="180" r="10"/>
    <circle cx="120" cy="230" r="10"/>
    <circle cx="120" cy="280" r="10"/>
  </g>
  <text x="120" y="105" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Input Vectors</text>

  <!-- Layer 2: Autoencoder Latent Space -->
  <g fill="#818cf8">
    <circle cx="240" cy="160" r="9"/>
    <circle cx="240" cy="210" r="9"/>
    <circle cx="240" cy="260" r="9"/>
  </g>
  <text x="240" y="130" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Latent Space (AE)</text>

  <!-- Layer 3: Bi-LSTM Sequence Nodes -->
  <g fill="#c084fc">
    <circle cx="360" cy="150" r="10"/>
    <circle cx="360" cy="205" r="10"/>
    <circle cx="360" cy="260" r="10"/>
  </g>
  <text x="360" y="120" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Bi-LSTM + Attention</text>

  <!-- Layer 4: Anomaly Classifier Output -->
  <g fill="#ef4444">
    <circle cx="480" cy="180" r="13"/>
    <text x="480" y="184" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">!</text>
  </g>
  <g fill="#10b981">
    <circle cx="480" cy="235" r="13"/>
    <text x="480" y="239" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">OK</text>
  </g>
  <text x="480" y="145" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Classification</text>

  <!-- Connections -->
  <g stroke="#334155" stroke-width="1.2" opacity="0.6">
    <line x1="130" y1="130" x2="231" y2="160"/>
    <line x1="130" y1="180" x2="231" y2="160"/>
    <line x1="130" y1="180" x2="231" y2="210"/>
    <line x1="130" y1="230" x2="231" y2="210"/>
    <line x1="130" y1="230" x2="231" y2="260"/>
    <line x1="130" y1="280" x2="231" y2="260"/>

    <line x1="249" y1="160" x2="350" y2="150"/>
    <line x1="249" y1="160" x2="350" y2="205"/>
    <line x1="249" y1="210" x2="350" y2="205"/>
    <line x1="249" y1="260" x2="350" y2="260"/>
    
    <line x1="370" y1="150" x2="467" y2="180" stroke="#f87171" stroke-width="2"/>
    <line x1="370" y1="205" x2="467" y2="235" stroke="#34d399" stroke-width="2"/>
    <line x1="370" y1="260" x2="467" y2="235" stroke="#34d399" stroke-width="2"/>
  </g>

  <!-- Formula badge overlay -->
  <rect x="180" y="295" width="240" height="22" rx="4" fill="#1e293b"/>
  <text x="300" y="310" fill="#94a3b8" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">L(θ) = -Σ [y·log(p) + (1-y)·log(1-p)]</text>
</svg>

